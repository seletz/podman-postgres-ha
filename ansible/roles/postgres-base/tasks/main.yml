---
- name: Create postgres group
  group:
    name: postgres
    gid: "{{ postgres_gid }}"
    state: present
  become: yes

- name: Create postgres user
  user:
    name: postgres
    uid: "{{ postgres_uid }}"
    group: postgres
    home: "{{ postgres_home_dir }}"
    create_home: yes
    shell: /bin/bash
  become: yes

- name: Ensure postgres home directory permissions
  file:
    path: "{{ postgres_home_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0755'
  become: yes

- name: Enable linger for postgres user
  command: loginctl enable-linger {{ postgres_uid }}
  become: yes
  changed_when: false

- name: Create PostgreSQL data directory
  file:
    path: "{{ postgres_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  become: yes

- name: Configure firewall for PostgreSQL
  firewalld:
    port: "{{ postgres_port }}/tcp"
    permanent: yes
    state: enabled
    immediate: yes
  become: yes

- name: Pull PostgreSQL container image
  containers.podman.podman_image:
    name: "{{ postgres_image }}"
    state: present
  become: yes

- name: Configure subuid for postgres user
  lineinfile:
    path: /etc/subuid
    line: "postgres:100000:65536"
    create: yes
  become: yes

- name: Configure subgid for postgres user
  lineinfile:
    path: /etc/subgid
    line: "postgres:100000:65536"
    create: yes
  become: yes

- name: Run podman system migrate for postgres user
  shell: podman system migrate
  become: yes
  become_user: postgres
  ignore_errors: yes