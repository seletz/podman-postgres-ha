---
- name: Create postgres group
  group:
    name: postgres
    gid: "{{ postgres_gid }}"
    state: present
  become: yes

- name: Create postgres user
  user:
    name: postgres
    uid: "{{ postgres_uid }}"
    group: postgres
    home: "{{ postgres_home_dir }}"
    create_home: yes
    shell: /bin/bash
  become: yes

- name: Create PostgreSQL data directory
  file:
    path: "{{ postgres_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  become: yes

- name: Configure firewall for PostgreSQL
  firewalld:
    port: "{{ postgres_port }}/tcp"
    permanent: yes
    state: enabled
    immediate: yes
  become: yes

- name: Pull PostgreSQL container image
  containers.podman.podman_image:
    name: "{{ postgres_image }}"
    state: present
  become: yes